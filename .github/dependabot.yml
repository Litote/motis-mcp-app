version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      exclude:
        - "Litote/*"
    groups:
      # A release of Litote/ci updates several workflows and actions: bump them in a single PR
      litote-ci:
        patterns:
          - "Litote/ci/*"

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # views (ui/) and web chat (web/)
  - package-ecosystem: "npm"
    directories:
      - "/ui"
      - "/web"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      # vitest and its plugins are released together
      vitest:
        patterns:
          - "*vitest*"

  - package-ecosystem: "terraform"
    directories:
      - "/infra"
      - "/infra/bootstrap"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      # A provider update changes both directories: bump them in a single PR
      terraform-providers:
        patterns:
          - "*"

  # MCP server (Dockerfile) and web chat (web/Dockerfile)
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/web"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
