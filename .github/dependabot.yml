version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      exclude:
        - "Litote/*"
    groups:
      # A release of Litote/ci updates several workflows and actions: bump them in a single PR
      litote-ci:
        patterns:
          - "Litote/ci/*"

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # views (ui/) and web chat (web/)
  - package-ecosystem: "npm"
    directories:
      - "/ui"
      - "/web"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      # vitest and its plugins are released together
      vitest:
        patterns:
          - "*vitest*"
      # The dependencies below are shared by ui/ and web/: bump both directories in a single PR
      jsdom:
        patterns:
          - "jsdom"
      vite:
        patterns:
          - "vite"
      typescript:
        patterns:
          - "typescript"
      types-node:
        patterns:
          - "@types/node"
      mcp-ext-apps:
        patterns:
          - "@modelcontextprotocol/ext-apps"

  - package-ecosystem: "terraform"
    directories:
      - "/infra"
      - "/infra/bootstrap"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      # A provider update changes both directories: bump them in a single PR
      terraform-providers:
        patterns:
          - "*"

  # MCP server (Dockerfile) and web chat (web/Dockerfile)
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/web"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      # The JDK stays on the LTS releases (25, then 29), as the toolchain of the build and GraalVM for the lambda: the
      # major version is changed by hand, the updates and digests of 25 still come
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
    groups:
      # Both Dockerfiles build with the same node image: bump them in a single PR
      node:
        patterns:
          - "node"
