name: Lambda log level

# Sets the level of the logs of the MCP Lambda (MOTIS_APP_LOG_LEVEL), without deploy: `info` logs each tool call, to
# investigate a problem; `warn` (default, normal operation) stops logging them. Kept by the deploys (ignore_changes in infra/main.tf). The new level applies to the new
# execution environments of the function, started by the update of its configuration.
on:
  workflow_dispatch:
    inputs:
      level:
        description: 'Level of the logs (info: one line per tool call; warn: the errors only)'
        type: choice
        options: [info, warn]
        default: info

concurrency:
  # not during a deploy (the configuration is updated by both)
  group: deploy-lambda-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  set-log-level:
    name: Set the log level
    runs-on: ubuntu-latest
    if: vars.AWS_REGION != ''
    # restricted to main by a deployment branch policy
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # the other variables are kept (the whole map is replaced): never printed, some are secret (vector tile URL)
      - name: Update the configuration of the function
        env:
          FUNCTION: motis-mcp-app
          LEVEL: ${{ inputs.level }}
        run: |
          aws lambda get-function-configuration --function-name "$FUNCTION" --query 'Environment.Variables' --output json |
            jq --arg level "$LEVEL" '{Variables: (. + {MOTIS_APP_LOG_LEVEL: $level})}' > "$RUNNER_TEMP/environment.json"
          aws lambda update-function-configuration --function-name "$FUNCTION" \
            --environment "file://$RUNNER_TEMP/environment.json" --query 'LastUpdateStatus' --output text
          rm "$RUNNER_TEMP/environment.json"
          aws lambda wait function-updated-v2 --function-name "$FUNCTION"
          echo "Log level of $FUNCTION: $LEVEL" >> "$GITHUB_STEP_SUMMARY"
