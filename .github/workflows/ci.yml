name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    uses: Litote/ci/.github/workflows/pr-title.yml@63a67e7add1b9fde6396c84399f90c9252f7b8e6 # v0.15.0

  # required check: "check / Check (tests, coverage, SonarCloud)"
  check:
    permissions:
      contents: read
    uses: $/.github/workflows/check.yml
    with:
      sonar-on-code-changes-only: true
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker:
    name: Docker image (build only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false

  docker-web:
    name: Web chat Docker image (build only, smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web
          load: true
          tags: motis-mcp-app-web:ci

      - name: Smoke test
        run: web/nginx/smoke-test.sh motis-mcp-app-web:ci

      # the files are built once on the runner platform (see web/Dockerfile): the arm64 image only copies them
      - name: Build (linux/amd64, linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web
          platforms: linux/amd64,linux/arm64
          push: false

  # the entries of the MCP registry are otherwise only checked by the release, once the images are pushed
  mcp-server-json:
    name: Validate server.json (MCP registry)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/install-mcp-publisher

      # the server (server.json) and its hosted instance Errance (errance.server.json)
      - name: Validate
        run: |
          ./mcp-publisher validate server.json
          ./mcp-publisher validate errance.server.json

  # Called on every pull request: a required check of a job skipped here would stay pending
  commit-guard:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: Litote/ci/.github/workflows/dependabot-commit-guard.yml@63a67e7add1b9fde6396c84399f90c9252f7b8e6 # v0.15.0
    with:
      allowed-paths: ^gradle/verification-metadata\.xml$
