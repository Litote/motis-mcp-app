name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    uses: Litote/ci/.github/workflows/pr-title.yml@b9071d15015f6816259c2170baae5aed063414a8 # v0.1.0

  check:
    name: Check (tests, coverage, SonarCloud)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # DynamoDB store of the stations of the journeys between cities (DynamoDbCityStationsStoreTest)
    services:
      dynamodb:
        image: amazon/dynamodb-local@sha256:6ada631ec7aa5fc83446855eb17233e3dad184fec47477e8140c6c569cfe0c86 # latest of 2026-10-15
        ports:
          - 8000:8000

    # every step: an input of the tests, which the steps after the build would otherwise run again without it (and
    # without the coverage of the DynamoDB store)
    env:
      DYNAMODB_LOCAL_ENDPOINT: http://localhost:8000

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # views (ui/) bundled by the Gradle build, web chat tests
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            web/package-lock.json

      - uses: Litote/ci/.github/actions/setup-gradle@fbeb51096c741360965275ed62a9011598259013 # v0.2.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - uses: Litote/ci/.github/actions/detect-changes@fbeb51096c741360965275ed62a9011598259013 # v0.2.0
        id: detect-changes
        with:
          pattern: '\.(kt|kts|gradle|yml|yaml|toml|ts|tsx|mjs|cjs|html|css|tf)$'

      - name: Build & test
        run: ./gradlew check

      - name: Views tests
        working-directory: ui
        # node_modules installed by the Gradle build (npmInstall)
        run: npm run coverage

      - name: Web chat tests
        working-directory: web
        # vitest does not check the types: tsc is otherwise only run by the deployment build
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run coverage

      - uses: Litote/ci/.github/actions/sonar-gradle@fbeb51096c741360965275ed62a9011598259013 # v0.2.0
        if: steps.detect-changes.outputs.has-code-changes == 'true'
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}

  docker:
    name: Docker image (build only)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false

  docker-web:
    name: Web chat Docker image (build only, smoke test)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web
          load: true
          tags: motis-mcp-app-web:ci

      - name: Smoke test
        run: web/nginx/smoke-test.sh motis-mcp-app-web:ci

      # the files are built once on the runner platform (see web/Dockerfile): the arm64 image only copies them
      - name: Build (linux/amd64, linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web
          platforms: linux/amd64,linux/arm64
          push: false
