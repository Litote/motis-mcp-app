name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release manually (e.g. v0.3.0)'
        required: true
        type: string

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/litote/motis-mcp-app
  WEB_IMAGE: ghcr.io/litote/motis-mcp-app-web

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    steps:
      - uses: Litote/ci/.github/actions/release-please@510461dc1f569a7c12735a6cad12e88a6cb533ad # v0.10.0
        id: release-please
        if: github.event_name == 'push'
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

  sonar:
    name: Tests and SonarCloud ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # DynamoDB store of the stations of the journeys between cities (DynamoDbCityStationsStoreTest)
    services:
      dynamodb:
        image: amazon/dynamodb-local@sha256:6ada631ec7aa5fc83446855eb17233e3dad184fec47477e8140c6c569cfe0c86 # latest of 2026-10-15
        ports:
          - 8000:8000

    # every step: an input of the tests, which the steps after the build would otherwise run again without it (and
    # without the coverage of the DynamoDB store)
    env:
      DYNAMODB_LOCAL_ENDPOINT: http://localhost:8000

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ needs.release-please.outputs.tag_name || inputs.tag }}
          fetch-depth: 0

      # views (ui/) bundled by the Gradle build, web chat tests
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            web/package-lock.json

      - uses: Litote/ci/.github/actions/setup-gradle@510461dc1f569a7c12735a6cad12e88a6cb533ad # v0.10.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build & test
        run: ./gradlew check

      - name: Views tests
        working-directory: ui
        # node_modules installed by the Gradle build (npmInstall)
        run: npm run coverage

      - name: Web chat tests
        working-directory: web
        # vitest does not check the types: tsc is otherwise only run by the deployment build
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run coverage

      # Fails if the quality gate is not OK, so nothing is published
      - uses: Litote/ci/.github/actions/sonar-gradle@510461dc1f569a7c12735a6cad12e88a6cb533ad # v0.10.0
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}

  docker:
    name: Publish Docker image ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    runs-on: ubuntu-latest
    needs: [release-please, sonar]
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ needs.release-please.outputs.tag_name || inputs.tag }}

      - name: Extract release version
        id: version
        env:
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # the jar is built once on the runner platform (see Dockerfile): no QEMU needed for arm64
      - name: Build and push
        uses: Litote/ci/.github/actions/docker-publish@ec46616b182954a0aa8013241b8d4565760db8de # v0.11.0
        with:
          image: ${{ env.IMAGE }}
          password: ${{ secrets.GITHUB_TOKEN }}
          context: .
          build-args: VERSION_NAME=${{ steps.version.outputs.version }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Smoke test
        env:
          IMAGE_TAG: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' |
            timeout 60 docker run -i --rm -e "MOTIS_APP_CONTACT=https://github.com/${GITHUB_REPOSITORY}" "$IMAGE_TAG" |
            jq -e 'select(.id == 2) | .result.tools | map(.name) | index("plan_journey")'

  docker-web:
    name: Publish web chat Docker image ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    runs-on: ubuntu-latest
    needs: [release-please, sonar]
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ needs.release-please.outputs.tag_name || inputs.tag }}

      - name: Extract release version
        id: version
        env:
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # the files are built once on the runner platform (see web/Dockerfile): no QEMU needed for arm64
      - name: Build and push
        uses: Litote/ci/.github/actions/docker-publish@ec46616b182954a0aa8013241b8d4565760db8de # v0.11.0
        with:
          image: ${{ env.WEB_IMAGE }}
          password: ${{ secrets.GITHUB_TOKEN }}
          context: web
          build-args: VERSION_NAME=${{ steps.version.outputs.version }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Smoke test
        env:
          IMAGE_TAG: ${{ env.WEB_IMAGE }}:${{ steps.version.outputs.version }}
        run: web/nginx/smoke-test.sh "$IMAGE_TAG"

  mcp-registry:
    name: Publish to the MCP registry ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    runs-on: ubuntu-latest
    # the registry checks the io.modelcontextprotocol.server.name label of the pushed image (see Dockerfile). A version
    # can't be removed from the registry: it is published once the GitHub release is, never for a draft release.
    needs: [release-please, docker, finalize-release]
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ needs.release-please.outputs.tag_name || inputs.tag }}

      # skipped for the tags without server.json (their image has no label either), and for a version already in the
      # registry (a release run again with workflow_dispatch), which refuses to publish a version twice
      - name: Check whether the version is to publish
        id: check
        env:
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
        run: |
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ ! -f server.json ]; then
            echo "::notice::no server.json at $TAG: not published to the MCP registry"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          name="$(jq -r .name server.json)"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0/servers/${name//\//%2F}/versions/${version}")"
          case "$status" in
            200)
              echo "::notice::$name $version is already in the MCP registry"
              echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            404)
              echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::unexpected status $status of the MCP registry"
              exit 1 ;;
          esac

      - name: Set the release version in server.json
        if: steps.check.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          jq --arg v "$VERSION" --arg image "${IMAGE}:${VERSION}" \
            '.version = $v | (.packages[] | select(.registryType == "oci")).identifier = $image' \
            server.json > server.json.tmp
          mv server.json.tmp server.json
          cat server.json

      - uses: $/.github/actions/install-mcp-publisher
        if: steps.check.outputs.publish == 'true'

      - name: Validate server.json
        if: steps.check.outputs.publish == 'true'
        run: ./mcp-publisher validate

      # proof of ownership of org.litote/*: Ed25519 key whose public key is in a TXT record on litote.org.
      # mcp-publisher only takes an in-process key as the --private-key argument (or a cloud KMS): the runner is
      # ephemeral and GitHub masks the secret in the logs.
      - name: Log in to the MCP registry
        if: steps.check.outputs.publish == 'true'
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: ./mcp-publisher login dns --domain litote.org --private-key "$MCP_PRIVATE_KEY"

      - name: Publish
        if: steps.check.outputs.publish == 'true'
        run: ./mcp-publisher publish

  finalize-release:
    name: Publish GitHub Release ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    runs-on: ubuntu-latest
    # Releases are created as drafts (see release-please-config.json): the release is published once its images are
    # pushed.
    needs: [release-please, docker, docker-web]
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest
