name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release manually (e.g. v0.3.0)'
        required: true
        type: string

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/litote/motis-mcp-app
  WEB_IMAGE: ghcr.io/litote/motis-mcp-app-web

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    steps:
      - uses: Litote/ci/.github/actions/release-please@731f25b65744afb6ed50783472a6746193353272 # v0.6.0
        id: release-please
        if: github.event_name == 'push'
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

  sonar:
    name: Tests and SonarCloud ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # DynamoDB store of the stations of the journeys between cities (DynamoDbCityStationsStoreTest)
    services:
      dynamodb:
        image: amazon/dynamodb-local@sha256:6ada631ec7aa5fc83446855eb17233e3dad184fec47477e8140c6c569cfe0c86 # latest of 2026-10-15
        ports:
          - 8000:8000

    # every step: an input of the tests, which the steps after the build would otherwise run again without it (and
    # without the coverage of the DynamoDB store)
    env:
      DYNAMODB_LOCAL_ENDPOINT: http://localhost:8000

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
          fetch-depth: 0

      # views (ui/) bundled by the Gradle build, web chat tests
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            web/package-lock.json

      - uses: Litote/ci/.github/actions/setup-gradle@fbeb51096c741360965275ed62a9011598259013 # v0.2.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build & test
        run: ./gradlew check

      - name: Views tests
        working-directory: ui
        # node_modules installed by the Gradle build (npmInstall)
        run: npm run coverage

      - name: Web chat tests
        working-directory: web
        # vitest does not check the types: tsc is otherwise only run by the deployment build
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run coverage

      # Fails if the quality gate is not OK, so nothing is published
      - uses: Litote/ci/.github/actions/sonar-gradle@fbeb51096c741360965275ed62a9011598259013 # v0.2.0
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}

  docker:
    name: Publish Docker image ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    runs-on: ubuntu-latest
    needs: [release-please, sonar]
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name || inputs.tag }}

      - name: Extract release version
        id: version
        env:
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # the jar is built once on the runner platform (see Dockerfile): no QEMU needed for arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION_NAME=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Smoke test
        env:
          IMAGE_TAG: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' |
            timeout 60 docker run -i --rm -e "MOTIS_APP_CONTACT=https://github.com/${GITHUB_REPOSITORY}" "$IMAGE_TAG" |
            jq -e 'select(.id == 2) | .result.tools | map(.name) | index("plan_journey")'

  docker-web:
    name: Publish web chat Docker image ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    runs-on: ubuntu-latest
    needs: [release-please, sonar]
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name || inputs.tag }}

      - name: Extract release version
        id: version
        env:
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # the files are built once on the runner platform (see web/Dockerfile): no QEMU needed for arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.WEB_IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION_NAME=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Smoke test
        env:
          IMAGE_TAG: ${{ env.WEB_IMAGE }}:${{ steps.version.outputs.version }}
        run: web/nginx/smoke-test.sh "$IMAGE_TAG"

  finalize-release:
    name: Publish GitHub Release ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    runs-on: ubuntu-latest
    # Releases are created as drafts (see release-please-config.json): the release is published once its images are
    # pushed.
    needs: [release-please, docker, docker-web]
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest
