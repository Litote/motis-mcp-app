name: Dependabot auto-merge

on:
  # pull_request_target gives access to the GitHub App secrets, which pull_request
  # events from Dependabot do not. No PR code is checked out or executed here.
  pull_request_target: # zizmor: ignore[dangerous-triggers] checks out nothing
    branches: [ main ]
    types: [ opened, reopened ]

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: read
    uses: Litote/ci/.github/workflows/dependabot-auto-merge.yml@c111317515db0963d8dfebb7821cefbc92d34897 # v0.9.0
    with:
      ecosystems: gradle,npm_and_yarn
      # Gradle plugins and the build tools run in the build without being called: they stay manual.
      exclude-dependencies: >-
        org.jetbrains.kotlin.*,
        com.gradleup.shadow*,
        org.graalvm.buildtools.native*,
        org.gradle.toolchains.foojay-resolver-convention*,
        org.sonarqube*,
        graalvm-native,
        kotlin,
        shadow,
        sonarqube
    secrets:
      RELEASE_PLEASE_APP_ID: ${{ secrets.RELEASE_PLEASE_APP_ID }}
      RELEASE_PLEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
