name: Deploy — AWS (Lambda + web chat)

# push to main → build, test, terraform apply (deploys the zip), smoke test of the endpoint, upload of the web chat.
# pull_request → build, test and terraform plan (no deploy). workflow_dispatch → manual deploy.
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'lambda/**'
      - 'ui/**'
      - 'web/**'
      - 'infra/**'
      - '!infra/bootstrap/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/deploy-lambda.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - 'lambda/**'
      - 'ui/**'
      - 'web/**'
      - 'infra/**'
      - '!infra/bootstrap/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/deploy-lambda.yml'
  workflow_dispatch:

concurrency:
  # one deploy at a time, never cancelled midway
  group: deploy-lambda-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── GraalVM native compile ────────────────────────────────────────────────
  build-native:
    name: Build Lambda (GraalVM native, arm64)
    # native-image compiles for the platform it runs on: the arm64 runner produces the executable of the Terraform
    # default `architecture` (arm64). Change both together.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up GraalVM CE 25
        uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'false'

      # views (ui/) bundled by the Gradle build
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          build-scan-publish: false

      - name: Test
        run: ./gradlew test

      - name: Compile native image
        run: ./gradlew :lambda:packageNative

      # The zip must match the Terraform `architecture`: fail rather than deploy a function that cannot start
      - name: Check the executable is arm64
        working-directory: lambda/build/native/nativeCompile
        run: |
          file bootstrap
          file bootstrap | grep -q "ARM aarch64" || { echo "::error::bootstrap is not arm64"; exit 1; }

      # Runs the executable in the Lambda runtime image: catches missing native-image metadata (make trace)
      - name: Smoke test in the Lambda runtime emulator
        run: |
          docker run -d --name lambda -p 9000:8080 \
            -e "MOTIS_APP_CONTACT=https://github.com/${GITHUB_REPOSITORY}" \
            -v "$PWD/lambda/build/native/nativeCompile/bootstrap:/var/runtime/bootstrap:ro" \
            public.ecr.aws/lambda/provided:al2023 bootstrap
          sleep 3
          invoke() {
            jq -n --arg body "$1" '{version: "2.0", rawPath: "/mcp", rawQueryString: "",
              headers: {host: "localhost", "content-type": "application/json",
                accept: "application/json, text/event-stream", "mcp-protocol-version": "2025-11-25"},
              requestContext: {http: {method: "POST", path: "/mcp"}}, body: $body, isBase64Encoded: false}' |
              curl -sf --data-binary @- http://localhost:9000/2015-03-31/functions/function/invocations
          }
          invoke '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' |
            jq -e '.statusCode == 200 and (.body | fromjson | .result.tools | map(.name) | index("plan_journey"))'
          invoke '{"jsonrpc":"2.0","id":2,"method":"resources/read","params":{"uri":"ui://motis/explorer.html"}}' |
            jq -e '.statusCode == 200 and (.body | fromjson | .result.contents[0].text | contains("<html"))'

      - name: Lambda emulator logs
        if: always()
        run: docker logs lambda 2>&1 || true

      - name: Upload lambda.zip
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lambda-zip
          path: lambda/build/libs/lambda.zip
          retention-days: 7

  # ── Web chat build ────────────────────────────────────────────────────────
  build-web:
    name: Build web chat
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Test
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build

      - name: Upload web dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  # ── Terraform plan (PR only) ──────────────────────────────────────────────
  terraform-plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    # Dependabot and fork PRs cannot access secrets/OIDC
    if: >-
      github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: build-native
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download lambda.zip
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lambda-zip
          path: lambda/build/libs

      - name: Configure AWS credentials (OIDC, read-only plan role)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '~1.15'

      - name: Terraform init
        working-directory: infra
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}"

      - name: Terraform plan
        working-directory: infra
        env:
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_motis_app_contact: ${{ vars.MOTIS_APP_CONTACT }}
          TF_VAR_tile_url: ${{ vars.MOTIS_TILE_URL }}
          TF_VAR_tile_attribution: ${{ vars.MOTIS_TILE_ATTRIBUTION }}
        # read-only role: no state lock
        run: terraform plan -input=false -no-color -lock=false

  # ── Terraform apply: deploys the zip ──────────────────────────────────────
  terraform-apply:
    name: Terraform apply
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build-native
    # restricted to main by a deployment branch policy
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download lambda.zip
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lambda-zip
          path: lambda/build/libs

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '~1.15'
          # raw `terraform output` for the smoke test
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infra
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}"

      - name: Terraform apply
        working-directory: infra
        env:
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_motis_app_contact: ${{ vars.MOTIS_APP_CONTACT }}
          TF_VAR_tile_url: ${{ vars.MOTIS_TILE_URL }}
          TF_VAR_tile_attribution: ${{ vars.MOTIS_TILE_ATTRIBUTION }}
        run: terraform apply -input=false -auto-approve -no-color

      - name: Smoke test of the endpoint
        working-directory: infra
        run: |
          url=$(terraform output -raw mcp_url)
          echo "MCP endpoint: $url" >> "$GITHUB_STEP_SUMMARY"
          curl -sf "$url" \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -H 'mcp-protocol-version: 2025-11-25' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' |
            jq -e '.result.tools | map(.name) | index("plan_journey")'

  # ── Web chat upload ───────────────────────────────────────────────────────
  deploy-web:
    name: Deploy web chat
    runs-on: ubuntu-latest
    needs: [build-web, terraform-apply]
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download web dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '~1.15'
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infra
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}"

      # config.json is written by Terraform: never uploaded nor deleted here
      - name: Upload and invalidate
        working-directory: infra
        run: |
          bucket=$(terraform output -raw web_bucket)
          aws s3 sync ../web/dist/assets "s3://$bucket/assets" --cache-control "public, max-age=31536000, immutable"
          aws s3 sync ../web/dist "s3://$bucket" --delete --exclude "assets/*" --exclude config.json --cache-control "no-cache"
          for id in $(terraform output -json web_distribution_ids | jq -r '.[]'); do
            aws cloudfront create-invalidation --distribution-id "$id" --paths "/*" --no-cli-pager > /dev/null
          done
          echo "Web chat: $(terraform output -raw web_url)" >> "$GITHUB_STEP_SUMMARY"
