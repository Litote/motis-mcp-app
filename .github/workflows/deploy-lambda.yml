name: Deploy — AWS (Lambda + web chat)

# push to main → build, test, terraform apply (deploys the zip), smoke test of the endpoint, upload of the web chat.
# pull_request → build, test and terraform plan (no deploy). workflow_dispatch → manual deploy.
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'lambda/**'
      - 'ui/**'
      - 'web/**'
      - 'infra/**'
      - '!infra/bootstrap/**'
      - 'gradle/**'
      - 'tools/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.nvmrc'
      - '.github/workflows/deploy-lambda.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - 'lambda/**'
      - 'ui/**'
      - 'web/**'
      - 'infra/**'
      - '!infra/bootstrap/**'
      - 'gradle/**'
      - 'tools/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.nvmrc'
      - '.github/workflows/deploy-lambda.yml'
  workflow_dispatch:

concurrency:
  # one deploy at a time, never cancelled midway
  group: deploy-lambda-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── GraalVM native compile ────────────────────────────────────────────────
  build-native:
    name: Build Lambda (GraalVM native, arm64)
    # native-image compiles for the platform it runs on: the arm64 runner produces the executable of the Terraform
    # default `architecture` (arm64). Change both together.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45

    # DynamoDB store of the stations of the journeys between cities, exercised by the smoke test
    services:
      dynamodb:
        image: amazon/dynamodb-local@sha256:6ada631ec7aa5fc83446855eb17233e3dad184fec47477e8140c6c569cfe0c86 # latest of 2026-10-15
        ports:
          - 8000:8000

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GraalVM CE 25 and Gradle
      - name: Set up GraalVM and Gradle
        uses: Litote/ci/.github/actions/setup-graalvm@de40fbf39509c6fa5816a9f2a5991af658aacc66 # v0.16.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # views (ui/) bundled by the Gradle build
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # version announced by the deployed server (serverInfo, User-Agent): the last release and the commit
      # (e.g. 0.1.0+8ef551b) instead of the main-SNAPSHOT of gradle.properties
      - name: Set the version
        run: |
          release=$(jq -r '."."' .release-please-manifest.json)
          echo "ORG_GRADLE_PROJECT_VERSION_NAME=${release}+${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # on a pull request, the tests are run by ci.yml: here only on main, as a last guard before the deploy
      - name: Test
        if: github.event_name != 'pull_request'
        run: ./gradlew test

      - name: Compile native image
        run: ./gradlew :lambda:packageNative

      # The zip must match the Terraform `architecture`: fail rather than deploy a function that cannot start
      - name: Check the executable is arm64
        uses: Litote/ci/.github/actions/check-native-arch@de40fbf39509c6fa5816a9f2a5991af658aacc66 # v0.16.0
        with:
          working-directory: lambda/build/native/nativeCompile
          binaries: bootstrap

      # Runs the executable in the Lambda runtime image, with MOTIS mocked: Transitous does not block the deployments
      - name: Smoke test in the Lambda runtime emulator
        run: ./gradlew :lambda:smokeTest

      - name: Lambda emulator logs
        if: always()
        run: docker logs lambda 2>&1 || true

      - name: Upload lambda.zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lambda-zip
          path: lambda/build/libs/lambda.zip
          retention-days: 7

  # ── Web chat build ────────────────────────────────────────────────────────
  build-web:
    name: Build web chat
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci --no-audit --no-fund

      # on a pull request, the tests are run by ci.yml: here only on main, as a last guard before the deploy
      - name: Test
        if: github.event_name != 'pull_request'
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build

      - name: Upload web dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  # ── Terraform plan (PR only) ──────────────────────────────────────────────
  terraform-plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Dependabot and fork PRs cannot access secrets/OIDC. Skipped until AWS is configured (vars.AWS_REGION, see docs/AWS-DEPLOYMENT.md)
    if: >-
      github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository && vars.AWS_REGION != ''
    needs: build-native
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download lambda.zip
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lambda-zip
          path: lambda/build/libs

      - name: Configure AWS credentials (OIDC, read-only plan role)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # exact Terraform version, and init with the committed lock file only
      - name: Set up Terraform
        uses: Litote/ci/.github/actions/setup-terraform@de40fbf39509c6fa5816a9f2a5991af658aacc66 # v0.16.0
        with:
          state-bucket: ${{ vars.TF_STATE_BUCKET }}

      - name: Terraform plan
        working-directory: infra
        # the variables of Terraform, shared with the apply below (YAML anchor)
        env: &terraform-env
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_motis_app_contact: ${{ vars.MOTIS_APP_CONTACT }}
          TF_VAR_tile_url: ${{ vars.MOTIS_TILE_URL }}
          TF_VAR_tile_attribution: ${{ vars.MOTIS_TILE_ATTRIBUTION }}
          # vector tiles, e.g. the Protomaps hosted API: the URL contains its key (docs/AWS-DEPLOYMENT.md)
          TF_VAR_vector_tile_url: ${{ secrets.MOTIS_VECTOR_TILE_URL }}
          # JSON map, e.g. {"chatgpt":"https://motis.example.org"}
          TF_VAR_view_domains: ${{ vars.MOTIS_VIEW_DOMAINS || '{}' }}
          # custom domain of the chat and of the MCP endpoint, e.g. motis.example.org (docs/AWS-DEPLOYMENT.md)
          TF_VAR_domain_name: ${{ vars.WEB_DOMAIN }}
          # name of the instance shown by the MCP clients, e.g. Errance
          TF_VAR_app_title: ${{ vars.MOTIS_APP_TITLE }}
          # links of the web chat to privacy.html and terms.html (those of errance.litote.org)
          TF_VAR_legal_pages: ${{ vars.WEB_LEGAL_PAGES == 'true' }}
          # -1 while the account concurrency quota is below 20 (10 executions must stay unreserved)
          TF_VAR_reserved_concurrency: ${{ vars.RESERVED_CONCURRENCY || 10 }}
          # monthly budget (USD) of the kill switch, and e-mail of the budget alerts (infra/budget.tf)
          TF_VAR_monthly_budget_usd: ${{ vars.MONTHLY_BUDGET_USD || 20 }}
          TF_VAR_budget_alert_email: ${{ vars.BUDGET_ALERT_EMAIL }}
          # tool calls a minute of a client on one Lambda instance, 0: no limit (docs/AWS-DEPLOYMENT.md)
          TF_VAR_rate_limit_per_minute: ${{ vars.RATE_LIMIT_PER_MINUTE || 30 }}
        # read-only role: no state lock. The plan is shown in the summary of the run, to review the infra changes
        # there rather than in the logs (the sensitive values are redacted by Terraform)
        run: |
          terraform plan -input=false -no-color -lock=false -out="$RUNNER_TEMP/tfplan"
          {
            echo '### Terraform plan'
            echo '```'
            # the summary of a step is limited to 1 MiB
            terraform show -no-color "$RUNNER_TEMP/tfplan" | head -c 900000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Terraform apply: deploys the zip ──────────────────────────────────────
  terraform-apply:
    name: Terraform apply
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # skipped until AWS is configured (vars.AWS_REGION, see docs/AWS-DEPLOYMENT.md): the deploy-web job is skipped with it
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.AWS_REGION != ''
    needs: build-native
    # restricted to main by a deployment branch policy
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download lambda.zip
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lambda-zip
          path: lambda/build/libs

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # exact Terraform version, and init with the committed lock file only
      - name: Set up Terraform
        uses: Litote/ci/.github/actions/setup-terraform@de40fbf39509c6fa5816a9f2a5991af658aacc66 # v0.16.0
        with:
          state-bucket: ${{ vars.TF_STATE_BUCKET }}

      - name: Terraform apply
        working-directory: infra
        env: *terraform-env
        run: terraform apply -input=false -auto-approve -no-color

      - name: Smoke test of the endpoint
        working-directory: infra
        run: |
          url=$(terraform output -raw mcp_url)
          echo "MCP endpoint: $url" >> "$GITHUB_STEP_SUMMARY"
          # retried: the function just updated may not answer at once (cold start, propagation)
          curl -sf --retry 5 --retry-delay 5 --retry-all-errors "$url" \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -H 'mcp-protocol-version: 2025-11-25' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' |
            jq -e '.result.tools | map(.name) | index("plan_journey")'

  # ── Web chat upload ───────────────────────────────────────────────────────
  deploy-web:
    name: Deploy web chat
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-web, terraform-apply]
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download web dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # exact Terraform version, and init with the committed lock file only
      - name: Set up Terraform
        uses: Litote/ci/.github/actions/setup-terraform@de40fbf39509c6fa5816a9f2a5991af658aacc66 # v0.16.0
        with:
          state-bucket: ${{ vars.TF_STATE_BUCKET }}

      # config.json is written by Terraform: never uploaded nor deleted here
      - name: Upload and invalidate
        working-directory: infra
        run: |
          bucket=$(terraform output -raw web_bucket)
          aws s3 sync ../web/dist/assets "s3://$bucket/assets" --cache-control "public, max-age=31536000, immutable"
          aws s3 sync ../web/dist "s3://$bucket" --delete --exclude "assets/*" --exclude config.json --cache-control "no-cache"
          for id in $(terraform output -json web_distribution_ids | jq -r '.[]'); do
            aws cloudfront create-invalidation --distribution-id "$id" --paths "/*" --no-cli-pager > /dev/null
          done
          echo "Web chat: $(terraform output -raw web_url)" >> "$GITHUB_STEP_SUMMARY"
