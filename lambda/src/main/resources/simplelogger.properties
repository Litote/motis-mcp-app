# slf4j-simple: stderr, collected by CloudWatch (which timestamps the lines)
org.slf4j.simpleLogger.logFile=System.err
org.slf4j.simpleLogger.defaultLogLevel=warn
# warn: the tool calls are not logged in normal operation (privacy policy); info, to investigate a problem: see
# MOTIS_APP_LOG_LEVEL and the workflow lambda-log-level.yml
org.slf4j.simpleLogger.log.org.litote=warn
org.slf4j.simpleLogger.showThreadName=false
